# BoredGamerUK comment tracker
# Uses variables from Mímir's Well: clusters/skirnir/mimir.env.example

name: boredgamertracker

services:
  web:
    image: nginx:1.27-alpine
    container_name: boredgamertracker-web
    restart: unless-stopped
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  api:
    image: python:3.12-alpine
    container_name: boredgamertracker-api
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - APP_PASSWORD=${BOREDGAMERTRACKER_PASSWORD}
    volumes:
      - ./api_server.py:/app/api_server.py:ro
      - ./site:/app/site
    working_dir: /app
    command: ["python3", "api_server.py"]
    networks:
      - proxy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M

  fetcher:
    image: python:3.12-alpine
    container_name: boredgamertracker-fetcher
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    volumes:
      - ./fetch_videos.py:/app/fetch_videos.py:ro
      - ./site:/app/site
    working_dir: /app
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install --no-cache-dir --quiet pyyaml
        while true; do
          python3 fetch_videos.py
          sleep 1800
        done
    networks:
      - default
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
