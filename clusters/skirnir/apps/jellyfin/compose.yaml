# Jellyfin
# Uses variables from Mímir's Well: clusters/skirnir/mimir.env.example

name: jellyfin

services:
  jellyfin:
    image: jellyfin/jellyfin:10.11.11
    container_name: jellyfin
    restart: unless-stopped

    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}

    volumes:
      - ${DOCKER_DATA}/jellyfin/config:/config
      - ${DOCKER_DATA}/jellyfin/cache:/cache
      # Transcoding temp dir — must be LOCAL storage, not the remote mount
      - ${DOCKER_DATA}/jellyfin/transcodes:/config/transcodes
      - ${MEDIA_PATH}:/media:ro
      - ${DOWNLOADS_PATH}:/downloads:ro
      - ${DOWNLOADS_PATH}:/media/USBDownloads:ro

    # Intel VAAPI hardware transcoding (iGPU passthrough)
    # If using NVIDIA, replace this with runtime: nvidia + NVIDIA_VISIBLE_DEVICES
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "993"   # render group on host — required for GPU access

    # No ports exposed: accessed via Caddy at jellyfin.${DOMAIN}
    networks:
      - proxy

    deploy:
      resources:
        limits:
          cpus: '6.0'
          memory: 6G

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}